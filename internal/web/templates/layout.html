{{define "layout"}}<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · GoGitServerMini</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6feb'/%3E%3Cpath d='M11 9l7 7-7 7' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1c2024;
    --muted: #667085;
    --line: #e3e6ea;
    --accent: #2f6feb;
    --danger: #c0392b;
    --code-bg: #1c2024;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header.topbar {
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px; }
  header.topbar .wrap { display: flex; align-items: center; gap: 12px; height: 56px; }
  header.topbar .brand { font-weight: 600; font-size: 16px; color: var(--text); }
  header.topbar .brand span { color: var(--accent); }
  main.wrap { padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .muted { color: var(--muted); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }
  .card + .card { margin-top: 16px; }
  form.create { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  input[type=text] {
    flex: 1 1 220px;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
    background: #fff;
    color: var(--text);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.06); }
  button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .notice {
    border-radius: 6px;
    padding: 10px 12px;
    margin: 12px 0 0;
    font-size: 14px;
  }
  .notice.error { background: #fdecea; color: #8c1d18; border: 1px solid #f5c2c0; }
  .notice.info { background: #eaf1fe; color: #1b4ba8; border: 1px solid #c9dafc; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  tbody tr:last-child td { border-bottom: none; }
  .repo-name { font-weight: 600; }
  .pill {
    display: inline-block;
    font-size: 12px;
    padding: 1px 8px;
    border-radius: 999px;
    background: #eef1f5;
    color: var(--muted);
    margin-left: 6px;
  }
  pre.snippet {
    background: var(--code-bg);
    color: #e6edf3;
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
    margin: 8px 0 0;
  }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .commit-list { list-style: none; margin: 0; padding: 0; }
  .commit-list li { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .commit-list li:last-child { border-bottom: none; }
  .commit-subject { font-weight: 500; }
  .commit-meta { font-size: 13px; color: var(--muted); }
  .hash { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .chips li { background: #eef1f5; border-radius: 6px; padding: 3px 9px; font-size: 13px; }
  details.danger-zone { margin-top: 28px; }
  details.danger-zone summary { cursor: pointer; color: var(--danger); font-size: 14px; }
  details.danger-zone form { margin-top: 10px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 24px 0 40px; }
  @media (max-width: 560px) {
    th.hide-sm, td.hide-sm { display: none; }
    header.topbar .wrap { height: 52px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/">GoGit<span>ServerMini</span></a>
  </div>
</header>
<main class="wrap">
{{template "content" .}}
</main>
<footer>GoGitServerMini · git server tự host tối giản</footer>
</body>
</html>
{{end}}
