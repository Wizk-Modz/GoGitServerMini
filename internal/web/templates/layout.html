{{define "layout"}}<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · GoGitServerMini</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M11 9l7 7-7 7' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    } catch (e) {}
  })();
</script>
<style>
{{css "base.css"}}
{{css "components.css"}}
{{css "pages.css"}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Bỏ qua điều hướng</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/" aria-label="GoGitServerMini - trang chủ">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12a3 3 0 0 0 3 3h6"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v3a3 3 0 0 1-3 3h-3"/></svg>
      </span>
      <span class="brand-text">GoGit<span>ServerMini</span></span>
    </a>
    <nav class="header-nav" aria-label="Điều hướng chính">
      <a class="header-link" href="/">Tất cả repo</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>
<main class="container main-content" id="main">
{{template "content" .}}
</main>
<footer class="site-footer">
  <div class="container footer-inner">
    <span class="footer-brand">GoGitServerMini</span>
    <span class="dot">·</span>
    <span>Git server tự host tối giản</span>
  </div>
</footer>
<script>
  (function () {
    var button = document.querySelector("[data-theme-toggle]");
    if (!button) return;
    var root = document.documentElement;
    button.addEventListener("click", function () {
      var dark = root.getAttribute("data-theme") === "dark" ||
        (!root.hasAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next = dark ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        var area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.top = "-1000px";
        document.body.appendChild(area);
        area.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(area);
        if (ok) { resolve(); } else { reject(new Error("copy failed")); }
      });
    }
    document.querySelectorAll("[data-copy]").forEach(function (copyButton) {
      copyButton.addEventListener("click", function () {
        var text = copyButton.getAttribute("data-copy");
        if (!text) return;
        var original = copyButton.textContent;
        var restore = function (label) {
          copyButton.textContent = label;
          copyButton.classList.add("is-copied");
          setTimeout(function () {
            copyButton.textContent = original;
            copyButton.classList.remove("is-copied");
          }, 1600);
        };
        copyText(text).then(function () {
          restore("Đã sao chép");
        }).catch(function () {
          restore("Không sao chép được");
        });
      });
    });
  })();
</script>
</body>
</html>
{{end}}
